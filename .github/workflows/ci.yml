# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: 🔍 CI Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Quality Checks
    # A reusable workflow may only DOWNGRADE the caller's grant, so the
    # work-item traceability job can enforce nothing the caller does not
    # hold. With no block here the job received contents+metadata read
    # only, and its `gh pr view` / `gh issue view` calls failed (#2476).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: CodySwannGT/lisa/.github/workflows/quality.yml@995f533b00d9b8a60256096bf6d28940164cd893 # v4.69.1
    with:
      node_version: '22.21.1'
      package_manager: 'bun'
      skip_jobs: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
