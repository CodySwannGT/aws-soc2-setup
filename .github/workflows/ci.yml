# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: 🔍 CI Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Quality Checks
    # A reusable workflow may only DOWNGRADE the caller's grant, so the
    # work-item traceability job can enforce nothing the caller does not
    # hold. With no block here the job received contents+metadata read
    # only, and its `gh pr view` / `gh issue view` calls failed (#2476).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: CodySwannGT/lisa/.github/workflows/quality.yml@f200685b372467c8769ad62113760e9542e597d5 # v4.87.14
    with:
      node_version: '22.21.1'
      package_manager: 'bun'
      skip_jobs: ''
      # Folds workflow-compatibility and declared-gate planning into the
      # preallocation job instead of paying for separate jobs. Not set by any
      # Lisa caller template — it is adopted per repo, and every other
      # quality.yml caller in this portfolio already passes it.
      combine_planning_checks: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
